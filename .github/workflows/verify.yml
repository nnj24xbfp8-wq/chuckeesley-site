name: Verify (install, build, audit)

# Runs a clean `npm ci` from the committed lockfile, builds the site, and
# reports `npm audit` findings. Exists so install/build/audit can be verified
# without a local Node toolchain. Runs on demand from the Actions tab, and
# automatically on pushes that touch dependencies or this workflow.

on:
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/verify.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Report toolchain versions
        run: |
          echo "node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Clean install from lockfile
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Audit dependencies
        # Audit findings should surface in the log without failing the job;
        # triage happens against the accepted-findings list, not the exit code.
        continue-on-error: true
        run: |
          echo "===== npm audit (human readable) ====="
          npm audit || true
          echo
          echo "===== npm audit (json) ====="
          npm audit --json || true
