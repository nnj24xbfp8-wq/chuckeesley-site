title: "The Shenzhen Experiment: The Story of China's Instant City"
author: "Juan Du"
year: 2020
category: "institutional"
why: "Dismantles the founding myth that Shenzhen was a fishing village conjured into a metropolis by central-government fiat. Du shows the deep local history and the provincial-level advocacy that actually produced the special economic zone. Essential background for anyone teaching or studying how the Shenzhen hardware ecosystem came to exist."
link: "https://www.hup.harvard.edu/catalog.php?isbn=9780674975286"
